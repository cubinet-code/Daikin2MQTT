name: Release firmware

# Push a tag like `v1.4-b3` to build the firmware and open a draft GitHub Release
# with the OTA binary attached. Edit the draft's prose notes, then publish.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e wifikit-serial-esp32-s3

      - name: Stage OTA binary
        run: |
          mkdir -p dist
          cp ".pio/build/wifikit-serial-esp32-s3/firmware.bin" \
             "dist/Daikin2MQTT_${GITHUB_REF_NAME}_OTA.bin"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # SemVer pre-release tags contain a hyphen (e.g. v1.4-b3, v1.5.0-rc.1),
          # so they are automatically flagged as a GitHub pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/Daikin2MQTT_${{ github.ref_name }}_OTA.bin
